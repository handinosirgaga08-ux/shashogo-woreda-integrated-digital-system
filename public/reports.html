<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a problem</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#1b2a22;--mute:#5b6b62;--line:#cfd8d2;--acc:#1f6b45;--accink:#fff;--err:#b3261e;--ok:#e6f2ea}
@media (prefers-color-scheme:dark){:root{--bg:#121a15;--card:#1a251e;--ink:#e6efe9;--mute:#9db0a5;--line:#31423a;--acc:#4fbf84;--accink:#0c1a12;--err:#ff8a80;--ok:#1d3326}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
h2{font-size:1.15rem;margin:0 0 10px}
p.sub{margin:0 0 16px;color:var(--mute)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=tel],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
select{height:44px;appearance:auto}
textarea{min-height:100px;resize:vertical}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.row label{margin:0;font-weight:400}
.row input{width:20px;height:20px}
button{border:0;border-radius:8px;padding:12px 16px;background:var(--acc);color:var(--accink);font-weight:600;width:100%;margin-top:16px;cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.msg{margin-top:12px;padding:10px;border-radius:8px}
.msg.err{color:var(--err);border:1px solid var(--err)}
.msg.ok{background:var(--ok)}
.track{font-size:1.4rem;font-weight:700;letter-spacing:.05em}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
ol{padding-left:18px;margin:8px 0 0}
small{color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Report a problem</h1>
<p class="sub">Tell the Woreda office about an issue in your Kebele. You will get a tracking number.</p>

<section id="formBox">
<form id="f" novalidate>
  <label for="kebele">Kebele</label>
  <select id="kebele" required><option value="">Loading…</option></select>

  <label for="category">Category</label>
  <select id="category" required><option value="">Choose a category</option></select>

  <label for="title">Title</label>
  <input type="text" id="title" maxlength="150" required>

  <label for="loc">Place or landmark <small>(optional)</small></label>
  <input type="text" id="loc" maxlength="200">

  <label for="desc">What happened?</label>
  <textarea id="desc" maxlength="3000"></textarea>

  <label for="photos">Photos <small>(up to 3, optional)</small></label>
  <input type="file" id="photos" accept="image/*" multiple>
  <div class="thumbs" id="thumbs"></div>

  <div class="row"><input type="checkbox" id="urgent"><label for="urgent">This is urgent</label></div>
  <div class="row"><input type="checkbox" id="anon"><label for="anon">Send without my phone number</label></div>

  <div id="phoneBox">
    <label for="phone">Phone <small>(optional, like 09XXXXXXXX)</small></label>
    <input type="tel" id="phone" maxlength="20" inputmode="tel">
  </div>

  <button type="submit" id="send">Send report</button>
  <div id="err" class="msg err" hidden></div>
</form>
<div id="done" class="msg ok" hidden>
  <p>Report sent. Save your tracking number:</p>
  <p class="track" id="trk"></p>
  <button type="button" id="again">Send another report</button>
</div>
</section>

<section>
  <h2>Track a report</h2>
  <label for="no">Tracking number</label>
  <input type="text" id="no" placeholder="SW-2026-ABC123" autocapitalize="characters">
  <button type="button" id="look">Check status</button>
  <div id="res"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const CATS = ["Service complaint","Infrastructure","Security","Health","Agriculture","Suggestion","Other"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let photos = [];

function fill(sel, first, items){
  sel.innerHTML = '<option value="">' + first + '</option>' + items.map(x => '<option>' + esc(x) + '</option>').join('');
}
async function load(){
  try {
    const d = await (await fetch('/api/public/kebeles')).json();
    fill($('kebele'), 'Choose a Kebele', d.kebeles || []);
  } catch (e) { fill($('kebele'), 'Could not load. Reload the page.', []); }
  let cats = CATS;
  try {
    const o = await (await fetch('/api/public/report-options')).json();
    if (Array.isArray(o.categories)) cats = o.categories;
  } catch (e) {}
  fill($('category'), 'Choose a category', cats);
}

$('anon').onchange = () => { $('phoneBox').hidden = $('anon').checked; };

// Shrink a picture to a JPEG under 250 KB.
function shrink(file){
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height, max = 1280;
      if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 330000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      out.length > 330000 ? bad() : ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(); };
    img.src = url;
  });
}
$('photos').onchange = async e => {
  photos = []; $('thumbs').innerHTML = '';
  for (const f of Array.from(e.target.files).slice(0, 3)) {
    try { const d = await shrink(f); photos.push(d); $('thumbs').insertAdjacentHTML('beforeend', '<img alt="Photo" src="' + d + '">'); }
    catch (x) { showErr('One photo could not be used. Try another.'); }
  }
};

function showErr(m){ const b = $('err'); b.textContent = m; b.hidden = !m; }

$('f').onsubmit = async e => {
  e.preventDefault(); showErr('');
  if (!$('kebele').value) return showErr('Choose a Kebele.');
  if (!$('category').value) return showErr('Choose a category.');
  if (!$('title').value.trim()) return showErr('Write a title.');
  $('send').disabled = true;
  try {
    const r = await fetch('/api/citizen-reports', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        kebele: $('kebele').value, category: $('category').value, title: $('title').value,
        locationDetail: $('loc').value, description: $('desc').value, photos,
        priority: $('urgent').checked ? 'Urgent' : 'Normal',
        anonymous: $('anon').checked, phone: $('phone').value
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not send. Try again.');
    $('trk').textContent = d.trackingNo;
    $('f').hidden = true; $('done').hidden = false;
  } catch (x) { showErr(x.message); }
  $('send').disabled = false;
};
$('again').onclick = () => {
  $('f').reset(); photos = []; $('thumbs').innerHTML = ''; $('phoneBox').hidden = false;
  $('f').hidden = false; $('done').hidden = true;
};

$('look').onclick = async () => {
  const no = $('no').value.trim();
  if (!no) return;
  $('res').innerHTML = '';
  try {
    const r = await fetch('/api/citizen-reports/track/' + encodeURIComponent(no));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Not found.');
    const x = d.report;
    $('res').innerHTML = '<div class="msg ok"><strong>' + esc(x.title) + '</strong><br>Status: ' + esc(x.status) +
      '<br>Kebele: ' + esc(x.kebele) + '<ol>' +
      x.updates.map(u => '<li>' + esc(u.status) + (u.note ? ': ' + esc(u.note) : '') +
        ' <small>' + new Date(u.created_at).toLocaleDateString() + '</small></li>').join('') + '</ol></div>';
  } catch (x) { $('res').innerHTML = '<div class="msg err">' + esc(x.message) + '</div>'; }
};

load();
</script>
</body>
</html>
