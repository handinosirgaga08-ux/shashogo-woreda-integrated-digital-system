<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report a problem</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f4;--card:#fff;--field:#f6faf7;--line:#cfdcd3;--text:#14221a;--muted:#5b6d62;--accent:#2f9e68;--on:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a16;--card:#1a2520;--field:#121b17;--line:#2c3b33;--text:#e6efe9;--muted:#9bada2;--accent:#4fc08a;--on:#0e1f16;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#111a16;--card:#1a2520;--field:#121b17;--line:#2c3b33;--text:#e6efe9;--muted:#9bada2;--accent:#4fc08a;--on:#0e1f16;--err:#ff8a80}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Roboto,"Noto Sans Ethiopic",system-ui,sans-serif}
:lang(am){font-family:"Noto Sans Ethiopic",Roboto,system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 14px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--text);padding:6px 10px;font:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
label:first-child{margin-top:0}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:76px;resize:vertical}
input[type=file]{color:var(--text);font:inherit;max-width:100%}
.chk{display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;margin:12px 0 0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
button.main{width:100%;margin-top:14px;background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{margin-top:12px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--field)}
.msg b{font-size:17px;letter-spacing:.5px}
.err{color:var(--err);border-color:var(--err)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="intro"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-l="en" aria-pressed="true">EN</button>
      <button type="button" data-l="am" aria-pressed="false">አማ</button>
    </div>
  </div>

  <form class="card" id="f" novalidate>
    <label for="kebele" data-t="kebele"></label>
    <select id="kebele" required></select>
    <input type="text" id="kebeleText" maxlength="100" hidden>

    <label for="cat" data-t="category"></label>
    <select id="cat" required></select>

    <label for="ttl" data-t="ttl"></label>
    <input type="text" id="ttl" required>

    <label for="place"><span data-t="place"></span> <small data-t="opt"></small></label>
    <input type="text" id="place">

    <label for="desc" data-t="desc"></label>
    <textarea id="desc" required></textarea>

    <label for="photos"><span data-t="photos"></span> <small data-t="photosHint"></small></label>
    <input type="file" id="photos" accept="image/*" multiple>

    <label class="chk"><input type="checkbox" id="urgent"> <span data-t="urgent"></span></label>
    <label class="chk"><input type="checkbox" id="anon" checked> <span data-t="anon"></span></label>

    <div id="phoneWrap" hidden>
      <label for="phone" data-t="phone"></label>
      <input type="tel" id="phone" inputmode="tel" placeholder="09…">
      <label for="email"><span data-t="email"></span> <small data-t="opt"></small></label>
      <input type="text" id="email" inputmode="email" autocapitalize="none">
    </div>

    <button class="main" type="submit" id="sendBtn" data-t="send"></button>
    <div class="msg" id="sent" hidden></div>
    <div class="msg err" id="formErr" hidden></div>
  </form>

  <section class="card">
    <h2 data-t="track"></h2>
    <label for="tn" data-t="tn"></label>
    <input type="text" id="tn" placeholder="SW-2026-ABC123" autocapitalize="characters">
    <button class="main" type="button" id="check" data-t="check"></button>
    <div class="msg" id="status" hidden></div>
  </section>
</main>

<script>
var T={
en:{title:"Report a problem",intro:"Tell the Woreda office about an issue in your Kebele. You will get a tracking number.",
kebele:"Kebele",category:"Category",ttl:"Title",place:"Place or landmark",opt:"(optional)",desc:"What happened?",
photos:"Photos",photosHint:"(up to 3, optional)",urgent:"This is urgent",anon:"Send without my phone number",phone:"Phone number",
send:"Send report",track:"Track a report",tn:"Tracking number",check:"Check status",
chooseK:"Choose a Kebele",chooseC:"Choose a category",
need:"Please fill in: Kebele, Category, Title and What happened.",needPhone:"Enter your phone number, or tick “Send without my phone number”.",
maxPhotos:"You can add up to 3 photos only.",sentMsg:"Report sent. Your tracking number is",keep:"Save it to check the status later.",
st:"Status",received:"Received by the Woreda office",nf:"No report found with this number. Check it and try again.",enterTn:"Enter a tracking number.",
urg:"Marked urgent",
email:"Email",sending:"Sending…",loadFail:"Could not load the form options. Check your connection and reload the page.",netFail:"Could not reach the server. Check your connection and try again. Your answers are still here.",badPhoto:"One of the photos could not be read. Try a different photo."},
am:{title:"ችግር ያሳውቁ",intro:"ስለ ቀበሌዎ ችግር ለወረዳ ጽ/ቤት ያሳውቁ። የመከታተያ ቁጥር ያገኛሉ።",
kebele:"ቀበሌ",category:"ምድብ",ttl:"ርዕስ",place:"ቦታ ወይም የቦታ ምልክት",opt:"(አማራጭ)",desc:"ምን ተፈጠረ?",
photos:"ፎቶዎች",photosHint:"(እስከ 3፣ አማራጭ)",urgent:"አስቸኳይ ነው",anon:"ያለ ስልክ ቁጥሬ ላክ",phone:"ስልክ ቁጥር",
send:"ሪፖርት ላክ",track:"ሪፖርት ተከታተል",tn:"የመከታተያ ቁጥር",check:"ሁኔታ ተመልከት",
chooseK:"ቀበሌ ይምረጡ",chooseC:"ምድብ ይምረጡ",
need:"እባክዎ ይሙሉ፦ ቀበሌ፣ ምድብ፣ ርዕስ እና ምን ተፈጠረ።",needPhone:"ስልክ ቁጥርዎን ያስገቡ ወይም “ያለ ስልክ ቁጥሬ ላክ” ይምረጡ።",
maxPhotos:"እስከ 3 ፎቶ ብቻ ማያያዝ ይችላሉ።",sentMsg:"ሪፖርትዎ ተልኳል። የመከታተያ ቁጥርዎ፦",keep:"ሁኔታውን ለመከታተል ያስቀምጡት።",
st:"ሁኔታ",received:"በወረዳ ጽ/ቤት ደርሷል",nf:"በዚህ ቁጥር የተመዘገበ ሪፖርት አልተገኘም። ቁጥሩን አረጋግጠው እንደገና ይሞክሩ።",enterTn:"የመከታተያ ቁጥር ያስገቡ።",
urg:"አስቸኳይ ተብሎ ተመዝግቧል",
email:"ኢሜይል",sending:"በመላክ ላይ…",loadFail:"የቅጹን አማራጮች መጫን አልተቻለም። ግንኙነትዎን አረጋግጠው ገጹን እንደገና ይጫኑ።",netFail:"ከአገልጋዩ ጋር መገናኘት አልተቻለም። ግንኙነትዎን አረጋግጠው እንደገና ይሞክሩ። የሞሉት መረጃ አልጠፋም።",badPhoto:"አንዱን ፎቶ ማንበብ አልተቻለም። ሌላ ፎቶ ይሞክሩ።"}
};
var lang="en", kebeles=[], cats=[], busy=false;
var $=function(id){return document.getElementById(id)};
var CAT_AM={"Service complaint":"የአገልግሎት ቅሬታ","Infrastructure":"መሠረተ ልማት","Water":"ውሃ","Road and transport":"መንገድና ትራንስፖርት","Education":"ትምህርት","Security":"ደህንነት","Health":"ጤና","Agriculture":"ግብርና","Suggestion":"አስተያየት","Other":"ሌላ"};
var ST_AM={"Submitted":"ተልኳል","Received":"በወረዳ ጽ/ቤት ደርሷል","In progress":"በሂደት ላይ","On hold":"ለጊዜው ቆሟል","Resolved":"ተፈትቷል","Rejected":"ውድቅ ተደርጓል"};

function api(url,opt){
  opt=opt||{};
  if(opt.body&&typeof opt.body!=="string"){opt.body=JSON.stringify(opt.body);opt.headers={"Content-Type":"application/json"}}
  return fetch(url,opt).then(function(r){
    return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){var e=new Error(j.error||"Error");e.status=r.status;throw e}
      return j;
    });
  });
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function show(id,html){var el=$(id);el.innerHTML=html;el.hidden=false}
function catLabel(c){return lang==="am"&&CAT_AM[c]?CAT_AM[c]:c}
function stLabel(c){return lang==="am"&&ST_AM[c]?ST_AM[c]:c}

function fill(sel,placeholder,items,keepVal){
  // items: [{v,l}]
  sel.innerHTML="";
  sel.add(new Option(placeholder,""));
  items.forEach(function(it){sel.add(new Option(it.l,it.v))});
  sel.value=keepVal||"";
}
function render(){
  var t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t[el.dataset.t]});
  fill($("kebele"),t.chooseK,kebeles.map(function(k){return{v:k,l:k}}),$("kebele").value);
  // No Kebele list set up on the server yet: let the person type the Kebele name.
  var free=!kebeles.length;
  $("kebele").hidden=free;$("kebeleText").hidden=!free;$("kebeleText").placeholder=t.chooseK;
  fill($("cat"),t.chooseC,cats.map(function(c){return{v:c,l:catLabel(c)}}),$("cat").value);
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});
  ["sent","formErr","status"].forEach(function(id){$(id).hidden=true});
}
function loadOptions(){
  var okK=api("/api/public/kebeles").then(function(r){kebeles=r.kebeles||[]});
  var okC=api("/api/public/report-options").then(function(r){cats=r.categories||[]});
  return Promise.all([okK,okC]).then(render).catch(function(){
    render();show("formErr",T[lang].loadFail);
  });
}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;render()}});
$("anon").onchange=function(){$("phoneWrap").hidden=$("anon").checked};
$("photos").onchange=function(){
  if($("photos").files.length>3){$("photos").value="";show("formErr",T[lang].maxPhotos)}
};

// Shrink a photo to a JPEG under ~240 KB (the server accepts at most 250 KB each).
function shrink(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var max=1280,tries=[[0.8,1],[0.65,1],[0.55,.8],[0.45,.65],[0.4,.5]];
      for(var i=0;i<tries.length;i++){
        var sc=Math.min(1,max/Math.max(img.width,img.height))*tries[i][1];
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
        var d=c.toDataURL("image/jpeg",tries[i][0]);
        if(d.length*0.75<240*1024)return resolve(d);
      }
      reject(new Error("photo"));
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("photo"))};
    img.src=url;
  });
}

$("f").onsubmit=function(e){
  e.preventDefault();
  if(busy)return;
  var t=T[lang];
  $("sent").hidden=true;$("formErr").hidden=true;
  var keb=kebeles.length?$("kebele").value:$("kebeleText").value.trim();
  if(!keb||!$("cat").value||!$("ttl").value.trim()||!$("desc").value.trim()){return show("formErr",t.need)}
  var anon=$("anon").checked;
  if(!anon&&!$("phone").value.trim()){return show("formErr",t.needPhone)}
  busy=true;$("sendBtn").disabled=true;$("sendBtn").textContent=t.sending;
  var files=Array.prototype.slice.call($("photos").files,0,3);
  Promise.all(files.map(shrink)).then(function(photos){
    return api("/api/citizen-reports",{method:"POST",body:{
      kebele:keb,category:$("cat").value,title:$("ttl").value.trim(),
      locationDetail:$("place").value.trim(),description:$("desc").value.trim(),
      priority:$("urgent").checked?"Urgent":"Normal",anonymous:anon,
      phone:anon?"":$("phone").value.trim(),email:anon?"":$("email").value.trim(),photos:photos}});
  }).then(function(r){
    $("f").reset();$("anon").checked=true;$("phoneWrap").hidden=true;
    render();
    $("tn").value=r.trackingNo;
    show("sent",t.sentMsg+" <b>"+esc(r.trackingNo)+"</b><br>"+t.keep);
  }).catch(function(err){
    var m=err.message==="photo"?t.badPhoto:(err.status?err.message:t.netFail);
    show("formErr",esc(m));
  }).then(function(){busy=false;$("sendBtn").disabled=false;$("sendBtn").textContent=T[lang].send});
};

$("check").onclick=function(){
  var t=T[lang],id=$("tn").value.trim().toUpperCase();
  $("status").classList.remove("err");
  if(!id){return show("status",t.enterTn)}
  api("/api/citizen-reports/track/"+encodeURIComponent(id)).then(function(r){
    var x=r.report,h=t.st+": <b>"+esc(stLabel(x.status))+"</b>"+(x.priority==="Urgent"?"<br>"+t.urg:"");
    (x.updates||[]).forEach(function(u){
      if(u.note&&u.note!=="Report submitted")h+="<br><small>"+esc(new Date(u.created_at).toLocaleDateString())+" - "+esc(u.note)+"</small>";
    });
    show("status",h);
  }).catch(function(err){
    $("status").classList.add("err");
    show("status",err.status===404?t.nf:(err.status?esc(err.message):t.netFail));
  });
};
loadOptions();
</script>
</body>
</html>
