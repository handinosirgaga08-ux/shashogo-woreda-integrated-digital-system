<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woreda announcements</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--field:#f7faf8;--line:#d3ded7;--text:#14221a;--muted:#5b6d62;--accent:#1f7a4d;--on:#fff;--warn:#a15c00;--warnbg:#fff1db;--bad:#b3261e;--badbg:#fde7e5;--ok:#1f7a4d;--okbg:#e2f3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101914;--card:#18231d;--field:#111b16;--line:#2b3a32;--text:#e6efe9;--muted:#9bada2;--accent:#4fc08a;--on:#0e1f16;--warn:#ffc46b;--warnbg:#3a2d12;--bad:#ff9a92;--badbg:#3c1d1a;--ok:#7fd9ad;--okbg:#17332549}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Roboto,"Noto Sans Ethiopic",system-ui,sans-serif}
:lang(am){font-family:"Noto Sans Ethiopic",Roboto,system-ui,sans-serif}
header{background:var(--accent);color:var(--on)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 10px}
h1{font-size:21px;margin:0}
.sub{margin:2px 0 0;font-size:13px;opacity:.9}
.lang{display:flex;border:1px solid currentColor;border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:inherit;padding:6px 10px;font:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--on);color:var(--accent);font-weight:700}
nav{display:flex;gap:4px}
nav button{flex:1;border:0;background:transparent;color:inherit;padding:10px 6px;font:inherit;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;opacity:.8}
nav button[aria-selected="true"]{border-bottom-color:var(--on);opacity:1;font-weight:700}
main{padding:16px 0 40px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bar .full{grid-column:1/-1}
select,input[type=text],input[type=date],textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
label.l small{font-weight:400;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.card.urgent{border-left:5px solid var(--bad)}
.card.important{border-left:5px solid var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.badge.important{background:var(--warnbg);color:var(--warn)}
.badge.urgent{background:var(--badbg);color:var(--bad)}
.badge.gray{background:var(--field);color:var(--muted);border:1px solid var(--line);font-weight:500}
.card h3{margin:2px 0 6px;font-size:17px}
.card p{margin:0 0 10px;white-space:pre-wrap}
.meta{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:8px}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line);padding:6px 10px;font-weight:500;font-size:13px}
.btn.full{width:100%;margin-top:16px;padding:12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.err{color:var(--bad);margin-top:10px;font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-l="en" aria-pressed="true">EN</button>
        <button type="button" data-l="am" aria-pressed="false">አማ</button>
      </div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tabBoard" aria-selected="true" data-t="board"></button>
      <button role="tab" id="tabPost" aria-selected="false" data-t="post" hidden></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="vBoard">
    <div class="bar">
      <select id="fK" aria-label="Kebele"></select>
      <select id="fS" aria-label="Sector"></select>
      <input class="full" type="text" id="q">
    </div>
    <div id="list"></div>
  </section>

  <section id="vPost" hidden>
    <div class="card">
      <label class="l" for="tEn" data-t="tEn"></label>
      <input type="text" id="tEn" maxlength="150">
      <label class="l" for="bEn" data-t="bEn"></label>
      <textarea id="bEn" maxlength="3000"></textarea>
      <label class="l" for="tAm" data-t="tAm"></label>
      <input type="text" id="tAm" lang="am" maxlength="150">
      <label class="l" for="bAm" data-t="bAm"></label>
      <textarea id="bAm" lang="am" maxlength="3000"></textarea>

      <label class="l" for="aud" data-t="pAud"></label>
      <select id="aud"></select>

      <label class="l" for="type" data-t="pType"></label>
      <select id="type"></select>

      <label class="l" for="exp"><span data-t="exp"></span> <small data-t="opt"></small></label>
      <input type="date" id="exp">

      <button class="btn full" id="publish" data-t="publish"></button>
      <div class="err" id="err" hidden></div>
      <p class="note" data-t="note"></p>
    </div>
  </section>
</main>

<script>
var WHOLE="Whole Woreda",ALLK="All Kebeles",ALLS="All Sectors";
var TYPES=["General","Emergency","Event","Service notice"];
var T={
en:{title:"Woreda announcements",sub:"Official notices for all Kebeles and sectors",board:"Announcements",post:"Post announcement",
search:"Search announcements",allKf:"All Kebeles",allSf:"All sectors",
tEn:"Title (English)",bEn:"Message (English)",tAm:"Title (Amharic)",bAm:"Message (Amharic)",
pAud:"Send to",pType:"Type",grpK:"Kebeles",grpS:"Sectors",
exp:"Valid until",opt:"(optional)",publish:"Publish announcement",
note:"Office use. Only the Woreda admin can post or delete. The English title is required; Amharic is optional.",
types:{"General":"General","Emergency":"Emergency","Event":"Event","Service notice":"Service notice"},
needTitle:"Add an English title.",adminOnly:"Only the Woreda admin can do this. Please log in as admin.",saveFail:"Could not save. Please try again.",
empty:"No announcements for this selection.",posted:"Posted",until:"Valid until",
copy:"Copy",copied:"Copied",del:"Delete",confirmDel:"Delete this announcement?",wholeW:"Whole Woreda"},
am:{title:"የወረዳ ማስታወቂያዎች",sub:"ለሁሉም ቀበሌዎችና ዘርፎች ይፋዊ ማስታወቂያ",board:"ማስታወቂያዎች",post:"ማስታወቂያ ለጥፍ",
search:"ማስታወቂያ ፈልግ",allKf:"ሁሉም ቀበሌዎች",allSf:"ሁሉም ዘርፎች",
tEn:"ርዕስ (እንግሊዝኛ)",bEn:"መልዕክት (እንግሊዝኛ)",tAm:"ርዕስ (አማርኛ)",bAm:"መልዕክት (አማርኛ)",
pAud:"የሚላክለት",pType:"ዓይነት",grpK:"ቀበሌዎች",grpS:"ዘርፎች",
exp:"የሚያገለግለው እስከ",opt:"(አማራጭ)",publish:"ማስታወቂያ አውጣ",
note:"ለጽ/ቤት አገልግሎት። ማስታወቂያ ማውጣትና መሰረዝ የሚችለው የወረዳ አስተዳዳሪ ብቻ ነው። የእንግሊዝኛ ርዕስ ግዴታ ነው፤ አማርኛ አማራጭ ነው።",
types:{"General":"አጠቃላይ","Emergency":"አስቸኳይ","Event":"ዝግጅት","Service notice":"የአገልግሎት ማሳሰቢያ"},
needTitle:"የእንግሊዝኛ ርዕስ ያስገቡ።",adminOnly:"ይህን ማድረግ የሚችለው የወረዳ አስተዳዳሪ ብቻ ነው። እባክዎ በአስተዳዳሪነት ይግቡ።",saveFail:"ማስቀመጥ አልተቻለም። እባክዎ እንደገና ይሞክሩ።",
empty:"ለዚህ ምርጫ ማስታወቂያ የለም።",posted:"የወጣው",until:"እስከ",
copy:"ቅዳ",copied:"ተቀድቷል",del:"ሰርዝ",confirmDel:"ይህ ማስታወቂያ ይሰረዝ?",wholeW:"መላው ወረዳ"}
};
var lang="en",items=[],kebeles=[],sectors=[],isAdmin=false,$=function(i){return document.getElementById(i)};

function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function day(s){var d=new Date(s);if(isNaN(d))return "";return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function pick(a){
  var en={t:a.title_en||"",b:a.body_en||""},am={t:a.title_am||"",b:a.body_am||""};
  var o=lang==="am"?am:en,f=lang==="am"?en:am;
  return o.t?o:f;
}
function audLabel(a){var t=T[lang];return a===WHOLE?t.wholeW:a===ALLK?t.allKf:a===ALLS?t.allSf:a}
function typeClass(ty){return ty==="Emergency"?"urgent":ty==="Service notice"?"important":""}

function fillSel(sel,first,arr){
  var v=sel.value;sel.innerHTML="";sel.add(new Option(first,""));
  arr.forEach(function(n){sel.add(new Option(n,n))});
  sel.value=v;if(sel.selectedIndex<0)sel.selectedIndex=0;
}
function fillType(){
  var s=$("type"),v=s.value||"General",t=T[lang];s.innerHTML="";
  TYPES.forEach(function(x){s.add(new Option(t.types[x],x))});
  s.value=v;
}
function fillAud(){
  var s=$("aud"),v=s.value||WHOLE,t=T[lang];s.innerHTML="";
  [[WHOLE,t.wholeW],[ALLK,t.allKf],[ALLS,t.allSf]].forEach(function(p){s.add(new Option(p[1],p[0]))});
  if(kebeles.length){var g=mk("optgroup");g.label=t.grpK;kebeles.forEach(function(n){g.appendChild(new Option(n,n))});s.appendChild(g)}
  if(sectors.length){var g2=mk("optgroup");g2.label=t.grpS;sectors.forEach(function(n){g2.appendChild(new Option(n,n))});s.appendChild(g2)}
  s.value=v;if(s.selectedIndex<0)s.selectedIndex=0;
}

// Announcements come from the Woreda server (PostgreSQL). Anyone can read.
function load(){
  var fk=$("fK").value,fs=$("fS").value,aud=[WHOLE];
  if(fk||fs){if(fk)aud.push(fk);if(fs)aud.push(fs)}
  else aud=aud.concat(kebeles,sectors);
  return fetch("/api/announcements?audiences="+encodeURIComponent(aud.join("|")),{credentials:"same-origin"})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){items=d.announcements||[];renderList()})
    .catch(function(){items=[];renderList()});
}

function renderList(){
  var t=T[lang],q=$("q").value.trim().toLowerCase(),L=$("list");
  L.innerHTML="";
  var shown=items.filter(function(a){
    if(!q)return true;
    var o=pick(a);return (o.t+" "+o.b).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){
    var ea=a.type==="Emergency"?0:1,eb=b.type==="Emergency"?0:1;
    return ea-eb; // Emergency first; server already sorts newest first
  });
  if(!shown.length){L.appendChild(mk("div","empty",t.empty));return}
  shown.forEach(function(a){
    var o=pick(a),cls=typeClass(a.type);
    var c=mk("article","card "+cls);
    var r=mk("div","row");
    r.appendChild(mk("span","badge "+cls,t.types[a.type]||a.type));
    r.appendChild(mk("span","badge gray",audLabel(a.audience)));
    c.appendChild(r);
    c.appendChild(mk("h3",null,o.t));
    if(o.b)c.appendChild(mk("p",null,o.b));
    c.appendChild(mk("div","meta",t.posted+": "+day(a.publish_at)+(a.expires_at?"  |  "+t.until+": "+day(a.expires_at):"")));
    var ac=mk("div","acts");
    var cp=mk("button","btn sec",t.copy);cp.type="button";
    cp.onclick=function(){
      var txt=o.t+"\n\n"+o.b;
      try{navigator.clipboard.writeText(txt).then(function(){cp.textContent=t.copied})}catch(e){}
    };
    ac.appendChild(cp);
    if(isAdmin){
      var dl=mk("button","btn sec",t.del);dl.type="button";
      dl.onclick=function(){
        if(!confirm(t.confirmDel))return;
        fetch("/api/announcements/"+a.id,{method:"DELETE",credentials:"same-origin"})
          .then(function(r){
            if(r.status===401||r.status===403){alert(t.adminOnly);return}
            if(!r.ok){alert(t.saveFail);return}
            return load();
          })
          .catch(function(){alert(t.saveFail)});
      };
      ac.appendChild(dl);
    }
    c.appendChild(ac);L.appendChild(c);
  });
}

function render(){
  var t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t[e.dataset.t]});
  $("q").placeholder=t.search;
  fillSel($("fK"),t.allKf,kebeles);
  fillSel($("fS"),t.allSf,sectors);
  fillType();fillAud();
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});
  $("tabPost").hidden=!isAdmin;
  if(!isAdmin&&!$("vPost").hidden)tab(false);
  renderList();
}

document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;render()}});
["fK","fS"].forEach(function(i){$(i).onchange=load});
$("q").oninput=renderList;
function tab(post){
  $("vBoard").hidden=post;$("vPost").hidden=!post;
  $("tabBoard").setAttribute("aria-selected",!post);$("tabPost").setAttribute("aria-selected",post);
}
$("tabBoard").onclick=function(){tab(false)};
$("tabPost").onclick=function(){tab(true)};

$("publish").onclick=function(){
  var t=T[lang],er=$("err"),btn=$("publish");er.hidden=true;
  var te=$("tEn").value.trim(),be=$("bEn").value.trim(),ta=$("tAm").value.trim(),ba=$("bAm").value.trim();
  function fail(m){er.textContent=m;er.hidden=false}
  if(!te)return fail(t.needTitle);
  var exp=$("exp").value;
  var body={titleEn:te,bodyEn:be,titleAm:ta,bodyAm:ba,type:$("type").value,audience:$("aud").value,
    expiresAt:exp?new Date(exp+"T23:59:59").toISOString():null};
  btn.disabled=true;
  fetch("/api/announcements",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){
      return r.json().catch(function(){return {}}).then(function(d){
        if(r.status===401||r.status===403)throw new Error(t.adminOnly);
        if(!r.ok)throw new Error(d.error||t.saveFail);
      });
    })
    .then(function(){
      ["tEn","bEn","tAm","bAm","exp"].forEach(function(i){$(i).value=""});
      $("aud").value=WHOLE;$("type").value="General";
      return load();
    })
    .then(function(){tab(false)})
    .catch(function(e){fail(e.message||t.saveFail)})
    .then(function(){btn.disabled=false});
};

// Start: show the page, then load the lists, find out if the visitor is the admin, and load the announcements.
render();
Promise.all([
  fetch("/api/public/kebeles").then(function(r){return r.json()}).then(function(d){kebeles=d.kebeles||[]}).catch(function(){}),
  fetch("/api/public/sectors").then(function(r){return r.json()}).then(function(d){sectors=d.sectors||[]}).catch(function(){}),
  fetch("/api/me",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():null})
    .then(function(d){isAdmin=!!(d&&d.user&&d.user.role==="admin")}).catch(function(){})
]).then(function(){render();return load()});
</script>
</body>
</html>
